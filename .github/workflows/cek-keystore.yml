name: Cek keystore
on:
  workflow_dispatch:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: Periksa secret keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "Panjang base64: ${#KS}"
          echo "Panjang store password: ${#STORE_PASSWORD}"
          echo "Panjang key password: ${#KEY_PASSWORD}"
          echo "Panjang alias: ${#KEY_ALIAS}"
          if [ "$STORE_PASSWORD" = "$KEY_PASSWORD" ]; then echo "Store dan key password: SAMA"; else echo "Store dan key password: BEDA"; fi
          echo "$KS" | base64 -d > ks.jks
          sha256sum ks.jks
          keytool -list -keystore ks.jks -storepass "$STORE_PASSWORD" && echo "HASIL: store password BENAR" || echo "HASIL: store password SALAH"
