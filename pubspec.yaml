name: catatan_uang
description: Tertata - aplikasi manajemen keuangan pribadi (Flutter + SQLite).
publish_to: 'none'
version: 5.10.0+13

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  fl_chart: ^0.69.0
  share_plus: ^10.1.4
  file_picker: ^8.1.2
  crypto: ^3.0.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  image_picker: ^1.1.2
  pdf: ^3.11.1
  cryptography: ^2.7.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/logo_mark.png
    - assets/logo_full.png
    - assets/logo_full_dark.png
    - assets/ainaci_mark.png
